# Publishes the zero-dependency HTML5 playable (web-playable/) to GitHub Pages:
#   https://efeertureten.github.io/pipeit/
name: Deploy web playable

on:
  push:
    branches: [main]
    paths:
      - 'web-playable/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web-playable
      - id: deployment
        uses: actions/deploy-pages@v4
